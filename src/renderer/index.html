<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: data: file:; img-src 'self' blob: data: file:;" />
  <title>Alto — Video Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

    #splash {
      position: fixed; inset: 0; background: #0f0f13;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; transition: opacity 0.4s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    .splash-logo {
      font-size: 64px; font-weight: 800; letter-spacing: 16px;
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 50%, #818cf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }
    .splash-tagline {
      margin-top: 12px; font-size: 13px; letter-spacing: 4px;
      color: rgba(255,255,255,0.35); text-transform: uppercase;
    }
    .splash-bar {
      margin-top: 48px; width: 160px; height: 2px;
      background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden;
    }
    .splash-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6366f1, #a78bfa);
      border-radius: 2px;
      animation: load 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.7; }
    }
    @keyframes load {
      0% { width: 0%; } 60% { width: 75%; } 85% { width: 90%; } 100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">ALTO</div>
    <div class="splash-tagline">Video Editor</div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>

  <div id="root"></div>
  <div id="error-display" style="display:none;padding:40px;background:#0f0f13;color:#ff6b6b;font-size:13px;font-family:monospace;white-space:pre-wrap;position:fixed;inset:0;overflow:auto;z-index:9999;"></div>

  <script>
    function showError(msg) {
      document.getElementById('splash').style.display = 'none';
      var d = document.getElementById('error-display');
      d.style.display = 'block';
      d.textContent = msg;
    }
    window.onerror = function(msg, src, line, col, err) {
      showError('Alto failed to start\n\n' + msg + '\n\nFile: ' + src + ':' + line + '\n\n' + (err ? err.stack : ''));
    };
    window.addEventListener('unhandledrejection', function(e) {
      showError('Alto failed to start\n\n' + (e.reason ? e.reason.stack || String(e.reason) : String(e)));
    });
    // Auto-hide splash once React mounts (fallback timeout)
    window.__hideSplash = function() {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('fade-out'); setTimeout(function(){ s.style.display='none'; }, 400); }
    };
    setTimeout(window.__hideSplash, 3000);
  </script>
</body>
</html>
